{% extends "base.html" %}
{% block content %}
<h1>{{ "Modifica" if grado else "Nuovo" }} Grado</h1>
<div class="card" style="margin-top:20px; max-width:500px;">
<form method="post">
    <div class="form-group">
        <label>Nome *</label>
        <input name="nome" value="{{ grado.nome if grado else '' }}" required>
    </div>
    <div class="form-group">
        <label>Ordine gerarchico *</label>
        <input name="ordine" type="number" value="{{ grado.ordine if grado else '' }}" required>
    </div>
    <div class="form-group">
        <label>ID Formula *</label>
        <input name="grado_id_formula" type="number" value="{{ grado.grado_id_formula if grado else '' }}" required>
    </div>
    <div class="form-group">
        <label>Punteggio minimo *</label>
        <input name="punteggio_minimo" type="number" value="{{ grado.punteggio_minimo if grado else 0 }}" required>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="is_ufficiale" {{ 'checked' if grado and grado.is_ufficiale }}> Ufficiale/Sottufficiale</label>
    </div>
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Salva</button>
        <a href="/gradi" class="btn btn-warning">Annulla</a>
    </div>
</form>
</div>
{% endblock %}
