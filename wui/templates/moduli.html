{% extends "base.html" %}
{% block content %}
<div class="top-bar">
    <h1>Moduli</h1>
    <a href="/moduli/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>
<table>
    <thead><tr>
        <th>Nome</th><th>Obbligatorio</th><th>Attivo</th><th>Azioni</th>
    </tr></thead>
    <tbody>
    {% for m in moduli %}
    <tr>
        <td>{{ m.nome }}</td>
        <td>{{ "Sì" if m.obbligatorio else "No" }}</td>
        <td>{{ "Sì" if m.attivo else "No" }}</td>
        <td class="actions">
            <a href="/moduli/{{ m.id }}/modifica" class="btn btn-warning">Modifica</a>
            <form class="inline" method="post" action="/moduli/{{ m.id }}/elimina"
                  onsubmit="return confirm('Eliminare questo modulo?')">
                <button class="btn btn-danger">Elimina</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
