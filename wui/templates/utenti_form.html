{% extends "base.html" %}
{% block content %}
<h1>{{ "Modifica" if utente else "Nuovo" }} Utente</h1>
<div class="card" style="margin-top:20px; max-width:500px;">
<form method="post">
    <div class="form-group">
        <label>Nome *</label>
        <input name="nome" value="{{ utente.nome if utente else '' }}" required>
    </div>
    <div class="form-group">
        <label>Username Telegram</label>
        <input name="username" value="{{ utente.username if utente else '' }}">
    </div>
    <div class="form-group">
        <label>Telegram ID</label>
        <input name="telegram_id" value="{{ utente.telegram_id if utente else '' }}">
    </div>
    <div class="form-group">
    	<label>Stato</label>
    	{% if utente %}
    	<select name="stato">
       	    {% for s in ['recluta','effettivo','inattivo'] %}
            <option value="{{ s }}" {{ 'selected' if utente.stato == s }}>{{ s }}</option>
            {% endfor %}
    	</select>
    	{% else %}
    	<input type="hidden" name="stato" value="recluta">
    	<input type="text" value="recluta" disabled>
    	{% endif %}
    </div>
    {% if utente %}
    <div class="form-group">
        <label>Grado</label>
        <select name="grado_id">
            <option value="">— nessuno —</option>
            {% for g in gradi %}
            <option value="{{ g.id }}" {{ 'selected' if utente.grado_id == g.id }}>{{ g.nome }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    {% if utente %}
    <div class="form-group">
        <label>Autonomia (1.0 - 1.5)</label>
        <input name="autonomia" type="number" step="0.1" min="1.0" max="1.5" value="{{ utente.autonomia }}">
    </div>
    <div class="form-group">
        <label>Leadership (1.0 - 1.5)</label>
        <input name="leadership" type="number" step="0.1" min="1.0" max="1.5" value="{{ utente.leadership }}">
    </div>
    <div class="form-group">
        <label>Pianificazione (1.0 - 1.5)</label>
        <input name="pianificazione" type="number" step="0.1" min="1.0" max="1.5" value="{{ utente.pianificazione }}">
    </div>
    {% endif %}
    {% if utente %}
    <div class="form-group">
        <label><input type="checkbox" name="is_istruttore" {{ 'checked' if is_istruttore }}> Istruttore</label>
    </div>
    <div class="form-group" style="border: 1px solid #ef5350; padding: 12px; border-radius: 4px;">
        <label style="color:#ef5350;">
            <input type="checkbox" name="is_admin" {{ 'checked' if is_admin }}>
            ⚠️ Admin bot Telegram — permette di usare i comandi di amministrazione sul bot (apertura/chiusura sondaggi, gestione utenti ecc.)
        </label>
    </div>
    {% endif %}
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Salva</button>
        <a href="/utenti" class="btn btn-warning">Annulla</a>
    </div>
</form>
</div>
{% endblock %}
