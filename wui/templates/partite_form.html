{% extends "base.html" %}
{% block content %}
<h1>{{ "Modifica" if partita else "Nuova" }} Partita</h1>
<div class="card" style="margin-top:20px; max-width:500px;">
<form method="post">
    <div class="form-group">
        <label>Nome *</label>
        <input name="nome" value="{{ partita.nome if partita else '' }}" required>
    </div>
    <div class="form-group">
        <label>Data e ora *</label>
        <input name="data_ora" type="datetime-local"
               value="{{ partita.data_ora.strftime('%Y-%m-%dT%H:%M') if partita and partita.data_ora else '' }}" required>
    </div>
    <div class="form-group">
        <label>Anno di gioco *</label>
        <select name="anno_gioco_id" required>
            <option value="">— seleziona —</option>
            {% for a in anni %}
            <option value="{{ a.id }}" {{ 'selected' if partita and partita.anno_gioco_id == a.id }}>{{ a.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="is_addestramento" {{ 'checked' if partita and partita.is_addestramento }}> Partita di addestramento</label>
    </div>
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Salva</button>
        <a href="/partite" class="btn btn-warning">Annulla</a>
    </div>
</form>
</div>
{% endblock %}
