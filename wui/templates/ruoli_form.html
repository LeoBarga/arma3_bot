{% extends "base.html" %}
{% block content %}
<h1>{{ "Modifica" if ruolo else "Nuovo" }} Ruolo</h1>
<div class="card" style="margin-top:20px; max-width:500px;">
<form method="post">
    <div class="form-group">
        <label>Nome *</label>
        <input name="nome" value="{{ ruolo.nome if ruolo else '' }}" required>
    </div>
    <div class="form-group">
        <label>Descrizione</label>
        <textarea name="descrizione" rows="3">{{ ruolo.descrizione if ruolo else '' }}</textarea>
    </div>
    <div class="form-group">
        <label>Grado minimo richiesto</label>
        <select name="grado_minimo_id">
            <option value="">— nessuno —</option>
            {% for g in gradi %}
            <option value="{{ g.id }}" {{ 'selected' if ruolo and ruolo.grado_minimo_id == g.id }}>{{ g.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="is_sl" {{ 'checked' if ruolo and ruolo.is_sl }}> Ruolo SL (bonus +30pt)</label>
    </div>
    {% if ruolo %}
    <div class="form-group">
        <label><input type="checkbox" name="attivo" {{ 'checked' if ruolo and ruolo.attivo }}> Attivo</label>
    </div>
    {% endif %}
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Salva</button>
        <a href="/ruoli" class="btn btn-warning">Annulla</a>
    </div>
</form>
</div>
{% endblock %}
