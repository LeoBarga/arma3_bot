{% extends "base.html" %}
{% block content %}
<div class="top-bar">
    <h1>Utenti</h1>
    <a href="/utenti/nuovo" class="btn btn-primary">+ Nuovo</a>
</div>
<table>
    <thead><tr>
        <th>Nome</th><th>Username</th><th>Stato</th><th>Grado</th><th>Punteggio</th><th>Azioni</th>
    </tr></thead>
    <tbody>
    {% for u in utenti %}
    <tr>
        <td>{{ u.nome }}</td>
        <td>{{ u.username or "—" }}</td>
        <td>{{ u.stato }}</td>
        <td>{{ u.grado_nome or "—" }}</td>
        <td>{{ u.punteggio }}</td>
        <td class="actions">
            <a href="/utenti/{{ u.id }}/modifica" class="btn btn-warning">Modifica</a>
            <form class="inline" method="post" action="/utenti/{{ u.id }}/elimina"
                  onsubmit="return confirm('Eliminare {{ u.nome }}?')">
                <button class="btn btn-danger">Elimina</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
