{% extends "base.html" %}
{% block content %}
<h1>{{ "Modifica" if modulo else "Nuovo" }} Modulo</h1>
<div class="card" style="margin-top:20px; max-width:500px;">
<form method="post">
    <div class="form-group">
        <label>Nome *</label>
        <input name="nome" value="{{ modulo.nome if modulo else '' }}" required>
    </div>
    <div class="form-group">
        <label>Descrizione</label>
        <textarea name="descrizione" rows="3">{{ modulo.descrizione if modulo else '' }}</textarea>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="obbligatorio" {{ 'checked' if not modulo or modulo.obbligatorio }}> Obbligatorio per diventare effettivo</label>
    </div>
    {% if modulo %}
    <div class="form-group">
        <label><input type="checkbox" name="attivo" {{ 'checked' if modulo.attivo }}> Attivo</label>
    </div>
    {% endif %}
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Salva</button>
        <a href="/moduli" class="btn btn-warning">Annulla</a>
    </div>
</form>
</div>
{% endblock %}
